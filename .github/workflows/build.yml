name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Создали релиз на сайте GitHub (Releases → Draft a new release) — собираем и прикладываем файлы
  release:
    types: [published]

permissions:
  contents: write

jobs:
  windows:
    name: Roomy (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Roomy.exe
        run: dotnet build src/Roomy/Roomy.csproj -c Release -o out

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build browser extension
        run: python extension/build.py

      - name: Checksums
        shell: pwsh
        run: |
          $files = @('out/Roomy.exe') + (Get-ChildItem extension/dist/*.zip | ForEach-Object { $_.FullName })
          $files | ForEach-Object { $h = Get-FileHash $_ -Algorithm SHA256; "$($h.Hash.ToLower())  $(Split-Path $_ -Leaf)" } | Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: roomy-build
          path: |
            out/Roomy.exe
            extension/dist/*.zip
            SHA256SUMS.txt

      - name: Publish release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/Roomy.exe
            extension/dist/*.zip
            SHA256SUMS.txt
          generate_release_notes: true

  extension-lint:
    name: Extension (Firefox validator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python extension/build.py
      - run: npx --yes web-ext lint --source-dir extension/dist/firefox
